# Pull requests: checks that the image still builds (nothing is published).
# Pushes to main: builds the image and publishes it as `latest`.
# Versioned images (vX.Y.Z) come from release.yml.
name: Build Docker image

on:
  pull_request:
    paths:
      - app/**
      - docker/**
      - requirements.txt
      - .github/workflows/build.yml
  push:
    branches:
      - main
    paths:
      - app/**
      - docker/**
      - requirements.txt
      - .github/workflows/build.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker:
    name: Build container image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Normalize image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: ${{ env.PUBLISH == 'true' }}
