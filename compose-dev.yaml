# Docker Compose Configuration
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile-dev
      args:
        PUID: ${PUID:-1000}
        PGID: ${PGID:-1000}
    ports:
      - "8000:8000"
    volumes:
      - ./media_data:/data
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000"]
    user: app
    depends_on:
      - scraper
  scraper:
    build:
      context: .
      dockerfile: Dockerfile-dev
      args:
        PUID: ${PUID:-1000}
        PGID: ${PGID:-1000}
    environment:
      SCRAPER_CRON: "${SCRAPER_CRON:-0 3 * * *}"
    volumes:
      - ./media_data:/data
    command: ["python", "-m", "scrapers.scraper"]
    user: app
